name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.name }})
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS
            os: macos-latest
            command: package:mac
          - name: Windows
            os: windows-latest
            command: package:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm check
      - run: pnpm ${{ matrix.command }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Inset Window Links $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            --verify-tag
      - name: Publish rolling preview from main
        if: github.ref == 'refs/heads/main'
        run: |
          preview_exists=$(gh release list --limit 1000 --json tagName --jq 'any(.[]; .tagName == "preview")')
          if [ "$preview_exists" = true ]; then
            gh release delete preview --cleanup-tag --yes
          fi
          gh release create preview dist/* \
            --target "$GITHUB_SHA" \
            --title "Preview build (main, ${GITHUB_SHA::7})" \
            --notes-file .github/release-notes.md \
            --prerelease
