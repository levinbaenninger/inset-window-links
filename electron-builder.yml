appId: ch.inset.prototype.windowlinks
productName: Inset Window Links
artifactName: inset-window-links-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/get-windows/**
npmRebuild: false
publish: null
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    NSAccessibilityUsageDescription: Inset Window Links reads which web page or file a window shows, so Reopen can bring it back.
    NSAppleEventsUsageDescription: Inset Window Links reads the address of the browser page you capture, so Reopen can open it again.
dmg:
  writeUpdateInfo: false
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
